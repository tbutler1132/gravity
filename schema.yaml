$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "gravity/codex/v0"

$defs:
  # ---------------------------------------------------------------
  # Week — the grid. ISO 8601 week identifiers: 2026-W36 is the 36th
  # week of 2026, running Mon 2026-08-31 through Sun 2026-09-06.
  # Weeks run Monday to Sunday, so a Week closes on the day off.
  # (ISO W01 is the week containing Jan 4, so the first Week of a
  # year can begin in the previous calendar year, and a year has 52
  # or 53 of them.)
  # Uniform, repeating, the same size every time; that sameness is
  # the point. A Week exists to carry rhythm: rituals, check-ins,
  # and habits that only work because the interval never changes.
  # Everyone's time has the same shape, and that is where belonging
  # comes from. It exists in the grammar as the unit other types are
  # measured in. The id fixes a Week's place in the grid; content is
  # the record of what actually happened in it — planning, check-ins,
  # retros — so every Week has an instance file.
  # ---------------------------------------------------------------
  Week:
    type: object
    required: [id, content]
    additionalProperties: false
    properties:
      id: { type: string, pattern: "^\\d{4}-W(0[1-9]|[1-4]\\d|5[0-3])$" }
      content: { type: string }

# ---------------------------------------------------------------
# Cycle — the arc. A bounded season oriented toward one output.
# Pinned to the grid: definite start and length in Weeks.
# Extension is legal but is a major Change (amend length_weeks;
# the amendment ships in a Release like everything else).
# Between Cycles is Ordinary Time — derived, never declared:
# any Week inside no Cycle is Ordinary Time by definition.
# ---------------------------------------------------------------
Cycle:
  type: object
  required: [id, name, content, length_weeks]
  additionalProperties: false
  properties:
    id: { type: string }
    name: { type: string }
    content: { type: string }
    length_weeks: { type: integer, minimum: 1 }
